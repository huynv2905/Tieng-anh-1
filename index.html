<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiếng Anh 1">
<meta name="theme-color" content="#EAF4F1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📕%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tiếng Anh 1 cùng con</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one column "sổ tay" — home = grid of 16 unit tiles; unit = sticky header + 3 tabs; big tap targets for a phone held by a parent */
:root{
  --bg:#EAF4F1; --surface:#FFFFFF; --tile:#FFF6DF; --ink:#1D2B33; --muted:#5A6B72;
  --line:#D3E3DF; --accent:#F2742B; --accent-ink:#FFFFFF; --teal:#1F8F80; --teal-soft:#D5EFEA;
  --good:#2E9A4E; --good-soft:#DDF3E3; --bad:#D9423F; --bad-soft:#FBE1DF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10191C; --surface:#1A262A; --tile:#2A2919; --ink:#EAF2F2; --muted:#9FB2B6;
  --line:#2C3C40; --accent:#FF8C4A; --accent-ink:#1A1208; --teal:#4CC2B0; --teal-soft:#173A36;
  --good:#5CCB7A; --good-soft:#173823; --bad:#FF7470; --bad-soft:#3E1D1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10191C; --surface:#1A262A; --tile:#2A2919; --ink:#EAF2F2; --muted:#9FB2B6;
  --line:#2C3C40; --accent:#FF8C4A; --accent-ink:#1A1208; --teal:#4CC2B0; --teal-soft:#173A36;
  --good:#5CCB7A; --good-soft:#173823; --bad:#FF7470; --bad-soft:#3E1D1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.muted{color:var(--muted)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:15.5px}
.note h3{font-size:19px;margin-bottom:6px;color:var(--teal)}
.note p{margin:6px 0}.note ul{margin:6px 0;padding-left:20px}.note li{margin:4px 0}

/* HOME */
.hero{padding-block:8px 16px;display:grid;gap:8px}
.hero h1{font-size:34px}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;max-width:60ch;font-size:16px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left;display:grid;gap:4px;align-content:start;min-height:150px;position:relative}
.ucard:active{transform:scale(.98)}
.ucard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ucard .letter{font-family:var(--display);font-size:38px;font-weight:800;line-height:1;color:var(--accent)}
.ucard .num{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ucard .t{font-weight:800;font-size:15.5px;line-height:1.25}
.ucard .v{font-size:13.5px;color:var(--muted)}
.ucard .pics{font-size:22px;letter-spacing:2px}
.ucard .prog{font-size:12.5px;font-weight:800;color:var(--good)}
.help{margin-top:18px}
details.note summary{font-weight:800;cursor:pointer;color:var(--teal);font-size:16px}
.voice{font-size:13px;color:var(--muted);margin-top:10px}

/* UNIT */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 8px;margin-inline:-4px;padding-inline:4px}
.bar{display:flex;align-items:center;gap:10px}
.back{min-width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:800;display:grid;place-items:center}
.utitle{min-width:0}
.utitle .k{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.utitle h2{font-size:24px}
.utitle .bigL{color:var(--accent);text-transform:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.tabs button{min-height:50px;border-radius:12px;font-weight:800;font-size:15px;line-height:1.1;padding:0 2px}
.tabs button{min-height:44px}
.tabs button[aria-selected="true"]{background:var(--teal);color:var(--surface)}
.pane{display:grid;gap:14px;margin-top:14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:52px;padding:0 20px;border-radius:16px;font-weight:800;font-size:17px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:44px;font-size:15px;padding:0 14px}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:620px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--tile);border:2px solid transparent;border-radius:20px;padding:14px 8px 12px;display:grid;justify-items:center;gap:2px;text-align:center}
.card.on{border-color:var(--accent);transform:scale(1.03)}
.pic{font-size:72px;line-height:1.1;height:88px;display:grid;place-items:center}
.pic.two{font-size:50px}
.pic svg{width:80px;height:80px}
.card .en{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.1}
.card .ipa{font-size:15px;color:var(--muted);font-family:"Lucida Grande","Segoe UI",system-ui,sans-serif}
.card .vi{font-size:15.5px;font-weight:700}
.hide-ipa .ipa{display:none}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--teal)}

.pat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
.pat .form{font-family:var(--display);font-size:26px;font-weight:800;color:var(--teal);line-height:1.15}
.pat .mean{font-weight:800}
.pat .use{font-size:15.5px;color:var(--muted)}
.ex{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:14px;padding:10px 12px}
.ex .s{min-width:0}
.ex .s b{display:block;font-size:20px;font-family:var(--display);line-height:1.2}
.ex .s span{font-size:14.5px;color:var(--muted)}
.say{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:20px;display:grid;place-items:center}

/* EXERCISES */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;min-height:46px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:14.5px;white-space:nowrap}
.chips button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .best{color:var(--good);margin-left:4px}
.chips button[aria-selected="true"] .best{color:inherit}
.exbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exhead h3{font-size:21px}
.score{font-weight:800;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.how{font-size:15px;color:var(--muted);margin:0}
.listen{justify-self:center;width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:40px;display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.listen:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:110px;border-radius:18px;background:var(--tile);border:3px solid transparent;display:grid;place-items:center;padding:8px}
.opt .pic{height:auto;font-size:60px}
.opt .pic svg{width:64px;height:64px}
.opt.word{min-height:80px;font-family:var(--display);font-size:28px;font-weight:800}
.opt.letter{min-height:72px;font-family:var(--display);font-size:38px;font-weight:800}
.opts.four-col{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);opacity:.6}
.hint{display:flex;align-items:center;justify-content:center;gap:12px}
.hint .pic{height:auto;font-size:64px}
.hint .pic svg{width:70px;height:70px}
.mini-say{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:22px;display:grid;place-items:center}
.word-gap{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.slot{min-width:44px;height:56px;border-radius:12px;background:var(--tile);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:32px;font-weight:800;padding:0 6px}
.slot.blank{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.slot.sp{min-width:16px;background:none;border:0}
.slot.wslot{font-size:22px;min-width:56px}
.answer{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:60px}
.answer.ok .slot{border-color:var(--good);background:var(--good-soft)}
.answer.no .slot{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tilebtn{min-width:56px;height:60px;border-radius:14px;background:var(--teal-soft);border:2px solid var(--teal);font-family:var(--display);font-size:30px;font-weight:800;padding:0 12px}
.tilebtn.w{font-size:22px}
.tilebtn:disabled{opacity:.2}
.row-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.feedback{text-align:center;font-family:var(--display);font-size:26px;font-weight:800;min-height:36px}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding-block:10px}
.result .big{font-family:var(--display);font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.result .stars{font-size:40px;letter-spacing:4px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}.card.on{transform:none}}
.spk{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px;justify-items:center;text-align:center}
.spk .bigpic .pic{font-size:110px;height:130px}.spk .bigpic .pic.two{font-size:76px}.spk .bigpic .pic svg{width:120px;height:120px}
.spk .target{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.15}
.spk .target.hidden{color:transparent;text-shadow:0 0 14px var(--muted)}
.mic{width:110px;height:110px;border-radius:50%;background:var(--teal);color:var(--surface);font-size:46px;display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--teal) 60%,#000)}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.heard{font-size:16px;color:var(--muted);min-height:24px}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.rate button{min-height:84px;border-radius:16px;background:var(--tile);border:2px solid var(--line);font-weight:800;font-size:14.5px;display:grid;place-items:center;gap:2px;padding:6px}
.rate button span{font-size:22px}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:34px;font-weight:800;display:grid;place-items:center;padding:4px;transition:transform .25s}
.mc.open{background:var(--tile);color:var(--ink);transform:rotateY(0)}
.mc.open .pic{font-size:40px;height:auto}.mc.open .pic.two{font-size:26px}.mc.open .pic svg{width:46px;height:46px}
.mc .w{font-size:17px;line-height:1.1;word-break:break-word;text-align:center}
.mc.done{background:var(--good-soft);border:2px solid var(--good)}
.sky{position:relative;height:330px;border-radius:18px;background:linear-gradient(var(--teal-soft),var(--bg));overflow:hidden;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;padding:10px 4px 18px}
.bl{justify-self:center;width:min(78px,21vw);height:min(96px,26vw);border-radius:50% 50% 48% 48%;display:grid;place-items:center;position:relative;animation:bob 2.4s ease-in-out infinite;transition:transform .3s,opacity .3s}
.bl::after{content:"";position:absolute;bottom:-34px;left:50%;width:2px;height:34px;background:var(--muted)}
.bl .pic{font-size:36px;height:auto}.bl .pic.two{font-size:22px}.bl .pic svg{width:42px;height:42px}
.bl.pop{transform:scale(1.6);opacity:0}
.bl:nth-child(2){animation-delay:-.6s}.bl:nth-child(3){animation-delay:-1.2s}.bl:nth-child(4){animation-delay:-1.8s}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -60px}}
.tfpic .pic{font-size:96px;height:110px}.tfpic .pic svg{width:100px;height:100px}
.tfword{font-family:var(--display);font-size:40px;font-weight:800;text-align:center}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfbtns button{min-height:90px;border-radius:18px;font-size:30px;font-weight:800;font-family:var(--display)}
.tfbtns .yes{background:var(--good-soft);border:3px solid var(--good);color:var(--good)}
.tfbtns .no{background:var(--bad-soft);border:3px solid var(--bad);color:var(--bad)}
.timer{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.timer i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
@media (prefers-reduced-motion:reduce){.bl{animation:none}}
.segs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.seg{min-width:52px;height:64px;border-radius:14px;background:var(--tile);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:34px;font-weight:800;padding:0 8px}
.seg.lit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dlg{display:grid;gap:8px;width:100%}
.bub{max-width:85%;padding:10px 14px;border-radius:16px;font-weight:800;font-size:18px;background:var(--tile)}
.bub.b{justify-self:end;background:var(--teal-soft)}
.bub.blur{color:transparent;text-shadow:0 0 12px var(--muted)}
.pal{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.sw{width:58px;height:58px;border-radius:50%;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw.sel{box-shadow:0 0 0 4px var(--ink)}
.copts .opt{position:relative}
.copts .opt.painted{border-width:6px}
.ynsent{font-family:var(--display);font-size:30px;font-weight:800;text-align:center;line-height:1.2}
.xcards .card .en{font-size:26px}
.map h3{font-size:21px}
.shelf{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:8px 0}
.stk{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--tile);border:2px solid var(--accent)}
.stk.off{font-size:13px;font-weight:800;color:var(--muted);border:2px dashed var(--line);background:none}
.gstage{position:relative;overflow:hidden;border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.gstage .it{position:absolute;left:0;top:0;will-change:transform;font-size:52px;line-height:1}
.gstage .it .pic{font-size:52px;height:auto}.gstage .it .pic.two{font-size:32px}.gstage .it .pic svg{width:58px;height:58px}
.runbg{height:280px;background:linear-gradient(#BFE6FF 0%,#E8F6FF 62%,#7CC56B 62%,#5FAE52 100%)}
.bunny{position:absolute;left:16px;bottom:96px;font-size:64px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.bunny.jump{transform:translateY(-70px) rotate(-12deg)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.target-chip{display:inline-flex;align-items:center;gap:8px;background:var(--tile);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:22px;font-weight:800}
.spark{position:absolute;font-size:30px;pointer-events:none;animation:spark .7s forwards}
@keyframes spark{to{transform:translateY(-60px) scale(1.4);opacity:0}}
.feedbg{height:360px;background:linear-gradient(#FFF1D6,#FFE2B8)}
.animal{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:110px;line-height:1;transition:transform .2s}
.animal.munch{animation:munch .5s 2}
@keyframes munch{50%{transform:translateX(-50%) scale(1.15,.9)}}
.animal.nope{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-60%)}75%{transform:translateX(-40%)}}
.say-bub{position:absolute;left:50%;top:140px;transform:translateX(-50%);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 12px;font-weight:800;white-space:nowrap;font-size:16px}
.food{position:absolute;bottom:14px;width:23%;height:96px;border-radius:16px;background:var(--surface);display:grid;place-items:center;touch-action:none;will-change:transform}
.food .pic{font-size:50px;height:auto}.food .pic.two{font-size:30px}.food .pic svg{width:54px;height:54px}
.catchbg{height:400px;background:linear-gradient(#D7F0FF,#F4FBFF)}
.basket{position:absolute;bottom:8px;left:0;font-size:64px;will-change:transform}
@media (prefers-reduced-motion:reduce){.spark,.animal.munch,.animal.nope{animation:none}}
.pbar{position:relative;height:30px;border-radius:15px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:15px;transition:width .4s}
.pbar span{position:relative;display:grid;place-items:center;height:100%;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.chk{width:100%;justify-content:center;min-height:58px;font-size:19px}
.chk:disabled{background:var(--line);color:var(--muted)}
.opt.sel,.tfbtns button.sel,.two-opt.sel{outline:4px solid var(--teal);outline-offset:2px}
.two-pic{background:var(--teal-soft);border-radius:18px;padding:14px;display:grid;place-items:center}
.two-pic .pic{font-size:96px;height:110px}.two-pic .pic.two{font-size:64px}.two-pic .pic svg{width:100px;height:100px}
.two-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two-opt{min-height:110px;border-radius:18px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
.two-opt .wave{display:flex;gap:4px;align-items:center}.two-opt .wave i{display:block;width:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.two-opt .pl{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px}

let VOICE=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();if(!vs.length)return;
  const us=v=>/en[-_]US/i.test(v.lang);
  const tag=v=>(v.name+" "+(v.voiceURI||"")).toLowerCase();
  const q=v=>/premium|cao c/.test(tag(v))?3:/enhanced|nâng cao|nang cao/.test(tag(v))?2:1;
  const avas=vs.filter(v=>/\bava\b/i.test(v.name)||/\.ava$/i.test(v.voiceURI||"")).sort((a,b)=>(q(b)+(us(b)?.5:0))-(q(a)+(us(a)?.5:0)));
  VOICE=avas[0]||vs.find(v=>us(v)&&/samantha/i.test(v.name))||vs.find(v=>us(v))||vs.find(v=>/^en/i.test(v.lang))||null;
  const el=document.getElementById("voiceName");
  if(el)el.textContent=VOICE?VOICE.name+" ("+VOICE.lang+")":"chưa tìm thấy giọng tiếng Anh";
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rate,onend){
  if(!("speechSynthesis" in window)){onend&&onend();return}
  if(!VOICE)pickVoice();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";if(VOICE)u.voice=VOICE;u.rate=rate||0.75;u.pitch=1.05;
  let done=false;const fin=()=>{if(!done){done=true;onend&&onend()}};
  u.onend=fin;u.onerror=fin;
  speechSynthesis.speak(u);
  if(onend)setTimeout(fin,Math.max(2500,text.length*260));
}

function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let prev=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return m[b.length]}
const NUM={"1":"one","2":"two","3":"three","4":"four","5":"five"};
function pkey(w){w=w.toLowerCase().replace(/ph/g,"f").replace(/ck/g,"k").replace(/[cq]/g,"k").replace(/x/g,"ks").replace(/z/g,"s").replace(/v/g,"b").replace(/th/g,"t").replace(/(.)\1+/g,"$1");return w[0]+w.slice(1).replace(/[aeiouyhw]/g,"")}

function autoStars(heard,target){
  const h=norm(heard.replace(/\d/g,d=>" "+(NUM[d]||"")+" ")),t=norm(target);if(!h)return 0;
  if(h===t||(" "+h+" ").includes(" "+t+" "))return 3;
  const tw=t.split(" "),hw=h.split(" ");
  const per=tw.map(w=>Math.max(...hw.map(x=>wordSim(x,w))));
  const avg=per.reduce((a,b)=>a+b,0)/per.length;
  const whole=Math.max(ratio(h.replace(/ /g,""),t.replace(/ /g,"")),ratio(pkey(h.replace(/ /g,"")),pkey(t.replace(/ /g,"")))*.75);
  const sc=Math.max(avg,whole);

let STRICT=false;try{STRICT=localStorage.getItem("ta1-strict")==="1"}catch(e){}
function easyStars(heard,target){
  const h=norm(heard),t=norm(target);if(!h)return 0;
  if(autoStars(heard,target)>=2)return 3;
  const f=t.replace(/^(i |he's |she's |it's |this is |that's |there's |look at |touch your |point to your |how many |hi |bye )/,"").trim()||t;
  const hw=h.split(" ");

        <button class="btn" id="next" hidden>Tiếp ›</button>

    $("#model",el).onclick=()=>speak(it.t);bindSeg();

    const pk=$("#peek",el);if(pk)pk.onclick=()=>{showWord=!showWord;$("#tg",el).classList.toggle("hidden",!showWord);pk.textContent=showWord?"Ẩn chữ":"Hiện chữ"};
    const fb=$("#fb",el),heard=$("#heard",el),mic=$("#mic",el),playB=$("#play",el),nextB=$("#next",el);
    let audioURL=null,done=false;
    playB.onclick=()=>{if(!audioURL)return;speechSynthesis&&speechSynthesis.cancel();const a=new Audio(audioURL);a.play().catch(()=>{})};
    nextB.onclick=()=>{if(audioURL)URL.revokeObjectURL(audioURL);i++;draw()};

      if(done)return;done=true;

      total+=st;$("#tg",el).classList.remove("hidden");
      const p=st===3?PRAISE[Math.floor(Math.random()*PRAISE.length)]:st===2?"Good try!":"Let's try again later!";

let GTOKEN=0;

function sfx(kind){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  if(kind==="jump"){o.type="square";o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(900,t+.18);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.21)}
  else if(kind==="win"){[523,659,784,1047].forEach((f,k)=>{const o2=AC.createOscillator(),g2=AC.createGain();o2.type="triangle";o2.frequency.value=f;o2.connect(g2);g2.connect(AC.destination);g2.gain.setValueAtTime(.15,t+k*.12);g2.gain.exponentialRampToValueAtTime(.001,t+k*.12+.25);o2.start(t+k*.12);o2.stop(t+k*.12+.26)});o.start(t);o.stop(t)}
  else if(kind==="munch"){o.type="sawtooth";o.frequency.setValueAtTime(140,t);g.gain.setValueAtTime(.06,t);[0,.12,.24].forEach(d=>{g.gain.setValueAtTime(.06,t+d);g.gain.setValueAtTime(.001,t+d+.06)});o.start(t);o.stop(t+.32)}
  else {o.start(t);o.stop(t)}}catch(e){}}

  $("#ls",box).onclick=()=>target&&speak(target.en);

    const w=(sinceTarget>=2||Math.random()<.45)?target:W4[Math.floor(Math.random()*4)];if(w===target)sinceTarget=0;
    const el=document.createElement("button");el.className="it";el.innerHTML=picHTML(w.pic);el.style.background="none";
    const y=150+Math.random()*30;const it={el,w,x:W+10,y,dead:false};el.style.transform=`translate3d(${it.x}px,${y}px,0)`;

function buildQs(u,e){
  const words=u.w.map(W);
  if(e==="e1") return shuffle(words).map((w,i)=>({type:"pick",w,opts:shuffle(words),mode:i%2?"word":"pic"}));
  if(e==="e5"){ if(u.n===1)return null; const pw=U[u.n-2].w.map(W); return shuffle(pw).map(w=>({type:"pick",w,opts:shuffle(pw),mode:"pic"})) }
  if(e==="e2") return shuffle(words).map(w=>{
    const chars=[...w.en];let idx=chars.findIndex(c=>c.toLowerCase()===u.L.toLowerCase());if(idx<0)idx=0;
    const ans=chars[idx];const up=ans===ans.toUpperCase();
    const pool=shuffle("abcdefghilmnoprstuw".split("").filter(c=>c!==ans.toLowerCase())).slice(0,3).map(c=>up?c.toUpperCase():c);
    return {type:"gap",w,idx,ans,opts:shuffle([ans,...pool])}});
  if(e==="e3") return shuffle(words).map(w=>({type:"scr",w}));
  if(e==="e4") return shuffle(u.o).map(s=>({type:"ord",s}));
  if(e==="e6") return shuffle(words).map(w=>{const o=shuffle(words.filter(x=>x.en!==w.en))[0];const good=qaFor(u,w.en)[1],bad=qaFor(u,o.en)[1];return {type:"two",w,good,opts:shuffle([good,bad])}});
  if(e==="a1") return shuffle(words).map(w=>({type:"blend",w,opts:shuffle(words)}));
  if(e==="a2") return shuffle(words).map(w=>{const t=DLGX[w.en]||DLG[u.n];return {type:"dlg",w,lines:t.map(x=>x.replace(/\{w\}/g,w.en)),opts:shuffle(words)}});
  if(e==="a3"){const nouns=shuffle(words.filter(w=>!NOCOL.includes(w.en)));const cs=shuffle(COLS);return nouns.map((w,k)=>({type:"col",w,c:cs[k%4],opts:shuffle(words)}))}
  if(e==="a4"){const qs=[];shuffle(words).forEach((w,k)=>{const yes=k%2===0;const pic=yes?w:shuffle(words.filter(x=>x.en!==w.en))[0];qs.push({type:"yn",w,s:readSent(w.en),pic,yes})});
    const extra=shuffle(words)[0];qs.push({type:"yn",w:extra,s:readSent(extra.en),pic:extra,yes:true});return qs}
}

function startEx(u,e,box,onDone,preset){
  const qs=preset||buildQs(u,e);const title=EX.concat(ADV).find(x=>x[0]===e)[1];const again=()=>startEx(u,e,box,onDone,preset?shuffle(preset):undefined);
  if(!qs){box.innerHTML=`<div class="exbox"><div class="exhead"><h3>${title}</h3></div><p class="how">Đây là bài đầu tiên nên chưa có bài cũ để ôn. Từ Unit 2 trở đi, phần này sẽ ôn 4 từ của bài trước.</p></div>`;return}
  let i=0,score=0,first=true;
  const head=()=>`<div class="exhead"><h3>${title}</h3><span class="score">⭐ ${score}</span></div><div class="pbar"><i style="width:${Math.min(i+1,qs.length)/qs.length*100}%"></i><span>${Math.min(i+1,qs.length)}/${qs.length}</span></div>`;
  function correct(fb){
    if(first)score++;
    fb.className="feedback ok pop";const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];fb.textContent=p+" 🎉";
    speak(p,0.9,()=>setTimeout(()=>{i++;first=true;draw()},350));
  }
  function wrong(fb,target){
    first=false;fb.className="feedback no";fb.textContent="Try again! 💪";
    if(target){target.classList.remove("shake");void target.offsetWidth;target.classList.add("shake")}
    speak("Try again!",0.9);
  }
  function draw(){
    if(i>=qs.length){
      setBest(u.n,e,score,qs.length);onDone&&onDone();
      const r=score/qs.length;const st=r===1?"⭐⭐⭐":r>=.6?"⭐⭐":"⭐";
      const msg=r===1?"Excellent!":r>=.6?"Good job!":"Nice try!";
      box.innerHTML=`<div class="exbox">${head()}<div class="result"><div class="stars">${st}</div><div class="big">${score}/${qs.length}</div><div class="feedback ok">${msg}</div>
        <p class="how">Điểm tính theo số câu bé làm đúng ngay lần đầu.</p>
        <button class="btn" id="again">↻ Làm lại</button></div></div>`;
      speak(msg,0.9);
      $("#again",box).onclick=again;return;
    }
    const q=qs[i];
    box.innerHTML=`<div class="exbox">${head()}<p class="how">${(HOW[e]||"Nghe và chọn hình đúng.")}</p><div id="q"></div><div class="feedback" id="fb" aria-live="polite"></div>
      <button class="btn chk" id="chk" disabled>Kiểm tra ➜</button>
      <div class="row-actions"><button class="btn small ghost" id="restart">↻ Làm lại từ đầu</button></div></div>`;
    $("#restart",box).onclick=again;
    const qd=$("#q",box),fb=$("#fb",box);
    if(q.type==="pick"){
      qd.innerHTML=`<div style="display:grid;gap:16px"><button class="listen" id="ls" aria-label="Nghe từ">🔊</button>
        <div class="opts">${q.opts.map((o,k)=>`<button class="opt ${q.mode==="word"?"word":""}" data-k="${k}">${q.mode==="word"?esc(o.en):picHTML(o.pic)}</button>`).join("")}</div></div>`;
      const play=()=>speak(q.w.en);$("#ls",qd).onclick=play;setTimeout(play,250);
      qd.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(b.disabled)return;const o=q.opts[b.dataset.k];
        if(o.en===q.w.en){b.classList.add("ok");qd.querySelectorAll(".opt").forEach(x=>x.disabled=true);correct(fb)}
        else{b.classList.add("no");b.disabled=true;wrong(fb,b)}
      });
    }
    if(q.type==="gap"){
      const chars=[...q.w.en];
      qd.innerHTML=`<div style="display:grid;gap:16px"><div class="hint">${picHTML(q.w.pic)}<button class="mini-say" id="ls" aria-label="Nghe từ">🔊</button></div>
        <div class="word-gap" id="wg">${chars.map((c,k)=>c===" "?`<span class="slot sp"></span>`:k===q.idx?`<span class="slot blank" id="bl">?</span>`:`<span class="slot">${esc(c)}</span>`).join("")}</div>
        <div class="opts four-col">${q.opts.map(o=>`<button class="opt letter" data-l="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`;
      $("#ls",qd).onclick=()=>speak(q.w.en);
      qd.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(b.disabled)return;
        if(b.dataset.l===q.ans){b.classList.add("ok");const bl=$("#bl",qd);bl.textContent=q.ans;bl.classList.remove("blank");qd.querySelectorAll(".opt").forEach(x=>x.disabled=true);speak(q.w.en,0.75,()=>correct(fb))}
        else{b.classList.add("no");b.disabled=true;wrong(fb,$("#wg",qd))}
      });
    }
    if(q.type==="blend"||q.type==="dlg"||q.type==="col"){
      const optsHTML=`<div class="opts ${q.type==="col"?"copts":""}">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${picHTML(o.pic)}</button>`).join("")}</div>`;
      let top="",play;
      if(q.type==="blend"){
        const segs=[...q.w.en];
        top=`<div class="segs" id="segs">${segs.map(c=>c===" "?`<span style="width:14px"></span>`:`<span class="seg">${esc(c)}</span>`).join("")}</div><button class="listen" id="ls" aria-label="Nghe">🔊</button>`;
        play=()=>{const ss=[...qd.querySelectorAll(".seg")];let k=0;ss.forEach(x=>x.classList.remove("lit"));
          const step=()=>{if(k<ss.length){ss.forEach(x=>x.classList.remove("lit"));ss[k++].classList.add("lit");setTimeout(step,650)}else{ss.forEach(x=>x.classList.add("lit"));speak(q.w.en,0.45,()=>setTimeout(()=>speak(q.w.en,0.75),300))}};step()};
      }
      if(q.type==="dlg"){
        top=`<button class="listen" id="ls" aria-label="Nghe hội thoại">🔊</button><div class="dlg">${q.lines.map((l,k)=>`<div class="bub ${k%2?"b":""} blur">${k%2?"🧒":"👧"} ${esc(l)}</div>`).join("")}</div>
          <div class="tools" style="justify-content:center"><button class="btn small ghost" id="show">Hiện chữ</button></div>`;
        play=()=>{let k=0;const nx=()=>{if(k>=q.lines.length)return;const l=q.lines[k];const pitch=k%2?1.25:0.95;k++;
          if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const ut=new SpeechSynthesisUtterance(l);ut.lang="en-US";if(VOICE)ut.voice=VOICE;ut.rate=0.75;ut.pitch=pitch;ut.onend=()=>setTimeout(nx,450);speechSynthesis.speak(ut)};nx()};
      }
      let selC=null;
      if(q.type==="col"){
        const instr="Colour the "+q.w.en+" "+q.c[0]+".";
        top=`<div class="hint"><button class="mini-say" id="ls" aria-label="Nghe">🔊</button><b style="font-size:20px">${esc(instr)}</b></div>
          <div class="pal">${COLS.map((c,k)=>`<button class="sw" data-c="${k}" style="background:${c[1]}" aria-label="${c[0]}"></button>`).join("")}</div>
          <p class="how" style="text-align:center">1. Chọn màu · 2. Bấm vào hình</p>`;
        play=()=>speak(instr);
      }
      qd.innerHTML=`<div style="display:grid;gap:14px;justify-items:center">${top}<div style="width:100%">${optsHTML}</div></div>`;
      $("#ls",qd).onclick=play;setTimeout(play,250);
      const sh=$("#show",qd);if(sh)sh.onclick=()=>qd.querySelectorAll(".bub").forEach(b=>b.classList.remove("blur"));
      qd.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{qd.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");selC=COLS[b.dataset.c];speak(selC[0],0.85)});
      qd.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(b.disabled)return;const o=q.opts[b.dataset.k];
        if(q.type==="col"){
          if(!selC){fb.className="feedback no";fb.textContent="Chọn màu trước nhé 🎨";return}
          b.style.background=selC[1];b.classList.add("painted");
          if(o.en===q.w.en&&selC[0]===q.c[0]){b.classList.add("ok");qd.querySelectorAll(".opt,.sw").forEach(x=>x.disabled=true);correct(fb)}
          else{setTimeout(()=>{b.style.background="";b.classList.remove("painted")},700);wrong(fb,b);fb.textContent=(o.en!==q.w.en?"Sai hình rồi. ":"Sai màu rồi. ")+"Try again! 💪"}
          return;
        }
        if(o.en===q.w.en){b.classList.add("ok");qd.querySelectorAll(".opt").forEach(x=>x.disabled=true);qd.querySelectorAll(".bub").forEach(x=>x.classList.remove("blur"));correct(fb)}
        else{b.classList.add("no");b.disabled=true;wrong(fb,b)}
      });
    }
    if(q.type==="yn"){
      qd.innerHTML=`<div style="display:grid;gap:14px;justify-items:center"><div class="tfpic">${picHTML(q.pic.pic)}</div>
        <div class="ynsent">${esc(q.s)}</div><button class="mini-say" id="ls" aria-label="Nghe câu">🔊</button>
        <div class="tfbtns" style="width:100%"><button class="yes" data-a="1">Yes ✓</button><button class="no" data-a="0">No ✗</button></div></div>`;
      $("#ls",qd).onclick=()=>speak(q.s);
      qd.querySelectorAll(".tfbtns button").forEach(b=>b.onclick=()=>{
        if(b.disabled)return;
        if((b.dataset.a==="1")===q.yes){qd.querySelectorAll(".tfbtns button").forEach(x=>x.disabled=true);speak(q.s,0.75,()=>correct(fb))}
        else{b.disabled=true;b.style.opacity=.4;wrong(fb,b)}
      });
    }
    if(q.type==="two"){
      const bars=n=>Array.from({length:n},(_,k)=>`<i style="height:${14+((k*37)%5)*8}px"></i>`).join("");
      qd.innerHTML=`<div style="display:grid;gap:14px"><div class="two-pic">${picHTML(q.w.pic)}</div>
        <div class="two-opts">${q.opts.map((o,k)=>`<button class="two-opt" data-k="${k}" data-say="${esc(o)}" aria-label="Câu ${k+1}"><span class="wave">${bars(3+k)}</span><span class="pl">▶</span></button>`).join("")}</div></div>`;
      qd.querySelectorAll(".two-opt").forEach(b=>b.onclick=()=>{
        if(b.disabled)return;
        if(q.opts[b.dataset.k]===q.good){b.classList.add("ok");qd.querySelectorAll(".two-opt").forEach(x=>x.disabled=true);fb.textContent=q.good;correct(fb)}
        else{b.classList.add("no");b.disabled=true;wrong(fb,b)}
      });
    }
    if(["pick","gap","blend","dlg","yn","two"].includes(q.type)){
      const chk=$("#chk",box);let pend=null;
      qd.querySelectorAll(".opt,.tfbtns button,.two-opt").forEach(b=>{const h=b.onclick;if(!h)return;
        b.onclick=ev=>{if(b.disabled)return;qd.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");pend=()=>h.call(b,ev);chk.disabled=false;if(b.dataset.say)speak(b.dataset.say)}});
      chk.onclick=()=>{if(!pend)return;const f=pend;pend=null;chk.disabled=true;qd.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));f()};
    } else $("#chk",box).hidden=true;
    if(q.type==="scr"||q.type==="ord"){
      const isW=q.type==="ord";
      const target=isW?q.s.split(" "):[...q.w.en].filter(c=>c!==" ");
      let tiles=target.map((t,k)=>({t,k}));
      do{tiles=shuffle(tiles)}while(tiles.length>1&&tiles.map(x=>x.t).join("|")===target.join("|"));
      let picked=[];
      const spaces=isW?[]:[...q.w.en].map((c,k)=>c===" "?k:-1).filter(k=>k>=0);
      const hint=isW?`<div class="hint"><button class="mini-say" id="ls" aria-label="Nghe câu">🔊</button><span class="muted" style="font-weight:700">Nghe câu rồi ghép lại</span></div>`
                    :`<div class="hint">${picHTML(q.w.pic)}<button class="mini-say" id="ls" aria-label="Nghe từ">🔊</button></div>`;
      qd.innerHTML=`<div style="display:grid;gap:16px">${hint}<div class="answer" id="ans"></div><div class="pool" id="pool"></div>
        <div class="row-actions"><button class="btn small ghost" id="undo">⌫ Xóa 1</button><button class="btn small ghost" id="clr">Xóa hết</button></div></div>`;
      const say=()=>speak(isW?q.s:q.w.en);$("#ls",qd).onclick=say;if(isW)setTimeout(say,250);
      const ans=$("#ans",qd),pool=$("#pool",qd);
      function paint(){
        let out=[];
        if(isW){out=target.map((_,k)=>`<span class="slot wslot ${picked[k]?"":"blank"}">${picked[k]?esc(picked[k].t):"&nbsp;"}</span>`)}
        else{let li=0;for(let k=0;k<[...q.w.en].length;k++){if(spaces.includes(k)){out.push(`<span class="slot sp"></span>`);continue}const p=picked[li++];out.push(`<span class="slot ${p?"":"blank"}">${p?esc(p.t):"&nbsp;"}</span>`)}}
        ans.innerHTML=out.join("");
        pool.innerHTML=tiles.map((x,k)=>`<button class="tilebtn ${isW?"w":""}" data-k="${k}" ${picked.includes(x)?"disabled":""}>${esc(x.t)}</button>`).join("");
        pool.querySelectorAll(".tilebtn").forEach(b=>b.onclick=()=>{
          const x=tiles[b.dataset.k];if(picked.includes(x))return;picked.push(x);paint();
                    if(picked.length===target.length){
            const okk=picked.map(p=>p.t).join("|")===target.join("|");
            if(okk){ans.className="answer ok";pool.querySelectorAll("button").forEach(z=>z.disabled=true);$("#undo",qd).disabled=true;$("#clr",qd).disabled=true;speak(isW?q.s:q.w.en,0.75,()=>correct(fb))}
            else{ans.className="answer no";wrong(fb,ans);setTimeout(()=>{picked=[];ans.className="answer";paint()},900)}
          }
        });
      }
      $("#undo",qd).onclick=()=>{picked.pop();ans.className="answer";paint()};
      $("#clr",qd).onclick=()=>{picked=[];ans.className="answer";paint()};
      paint();
    }
  }
  draw();
}

route();
</script>

</body></html>
